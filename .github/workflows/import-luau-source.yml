name: Import verified Luau source

on:
  pull_request:
    branches: [main]
    paths:
      - .source-import-ready

permissions:
  contents: write

jobs:
  import:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'source-import'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .source-payload-v3/part-* > "$RUNNER_TEMP/luau.zstpatch.b64"
          base64 -d "$RUNNER_TEMP/luau.zstpatch.b64" > "$RUNNER_TEMP/luau.zstpatch"
          echo '6afda500fcabe9cecadd761d1ab71f40bf46f4883be466d24fedceba7ca5c304  '"$RUNNER_TEMP/luau.zstpatch" | sha256sum -c -

      - name: Rebuild exact uploaded source
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi
          mkdir -p "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" init -q
          git -C "$RUNNER_TEMP/upstream" remote add origin https://github.com/AZYsGithub/shiny.git
          git -C "$RUNNER_TEMP/upstream" fetch -q --depth=1 origin b8ec7a1ea410387f853ec6d5136a7bf302942388
          git -C "$RUNNER_TEMP/upstream" checkout -q FETCH_HEAD
          rm -rf "$RUNNER_TEMP/upstream/.git"
          (
            cd "$RUNNER_TEMP/upstream"
            tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner -cf "$RUNNER_TEMP/upstream.tar" .
          )
          zstd -q -d --patch-from="$RUNNER_TEMP/upstream.tar" "$RUNNER_TEMP/luau.zstpatch" -o "$RUNNER_TEMP/final.tar"
          echo 'b6e098982650e2c6e75070e34142727b5f8d012f628b1fc4a2434a72b8d70b7d  '"$RUNNER_TEMP/final.tar" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/final"
          tar -xf "$RUNNER_TEMP/final.tar" -C "$RUNNER_TEMP/final"

      - name: Verify final tree shape
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'final'
          files = sorted(p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file())
          if len(files) != 168:
              raise SystemExit(f'expected 168 files, got {len(files)}')
          forbidden = [
              'Luau.zip', 'luau', '.source-payload', '.source-payload-v2',
              '.source-payload-v3', '.source-import-ready', '.import-xz',
              '.import-xz18', '.import-payload', '.github'
          ]
          for name in forbidden:
              if (root / name).exists():
                  raise SystemExit(f'forbidden staging artifact in final tree: {name}')
          required = ['Cargo.toml', 'ast', 'cfg', 'luau-lifter', 'restructure']
          for name in required:
              if not (root / name).exists():
                  raise SystemExit(f'missing expected source entry: {name}')
          print('Verified final source tree:', len(files), 'files')
          PY

      - name: Replace main atomically
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B import-main origin/main
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/final/." .
          git add -A
          git config user.name 'AnnonyA source importer'
          git config user.email '79977221+AnnonyA@users.noreply.github.com'
          git commit -m 'chore: replace repository with Luau decompiler source'
          git push origin HEAD:main
          echo "Imported commit: $(git rev-parse HEAD)"
